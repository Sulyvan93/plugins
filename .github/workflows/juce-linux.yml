name: Trem de Medir - compilacao JUCE Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  juce-vst3-linux:
    name: Compilar codigo JUCE no Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar bibliotecas de desenvolvimento JUCE
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev \
            libcurl4-openssl-dev pkg-config
      - name: Configurar projeto JUCE
        run: cmake -S . -B build-juce -DCMAKE_BUILD_TYPE=Release
      - name: Compilar VST3 e Standalone
        run: cmake --build build-juce --config Release --parallel 2
