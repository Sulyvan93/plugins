name: Compilar Trem de Medir para Mac M4

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  macos:
    name: Criar plugins AU e VST3
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Mostrar ferramentas
        run: |
          xcodebuild -version
          cmake --version

      - name: Testar o motor de audio
        run: |
          cmake -S . -B build-dsp -DTREM_DSP_TEST_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-dsp --parallel 3
          ctest --test-dir build-dsp --output-on-failure

      - name: Preparar compilacao JUCE para Apple Silicon
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

      - name: Compilar plugins e aplicativo
        run: cmake --build build --config Release --parallel 3

      - name: Empacotar arquivos para instalar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p entrega
          au="$(find build/TremDeMedir_artefacts -type d -name '*.component' -print -quit)"
          vst3="$(find build/TremDeMedir_artefacts -type d -name '*.vst3' -print -quit)"
          app="$(find build/TremDeMedir_artefacts -type d -name '*.app' -print -quit)"
          test -n "$au" && test -d "$au"
          test -n "$vst3" && test -d "$vst3"
          ditto -c -k --sequesterRsrc --keepParent "$au" entrega/Trem-de-Medir-AU-macOS-M4.zip
          ditto -c -k --sequesterRsrc --keepParent "$vst3" entrega/Trem-de-Medir-VST3-macOS-M4.zip
          if [[ -n "$app" && -d "$app" ]]; then
            ditto -c -k --sequesterRsrc --keepParent "$app" entrega/Trem-de-Medir-App-macOS-M4.zip
          fi
          ls -lh entrega

      - name: Disponibilizar plugins para baixar
        uses: actions/upload-artifact@v4
        with:
          name: Trem-de-Medir-macOS-M4
          path: entrega/*.zip
          if-no-files-found: error
          retention-days: 14
